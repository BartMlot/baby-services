services:
  notification-service:
    build: .
    ports:
      - "8002:8000"
    depends_on:
      postgres-notification:
        condition: service_healthy
    environment:
      # Override localhost DSNs from .env with Docker service names
      DATABASE_URL: "postgresql://notif_user:notif_pass@postgres-notification:5432/notification?serverVersion=15&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
    networks:
      - platform_net

  postgres-notification:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notification"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

volumes:
  postgres_notification_data:

networks:
  platform_net:
    external: true
    name: platform_net
