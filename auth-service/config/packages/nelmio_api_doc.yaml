nelmio_api_doc:
    documentation:
        info:
            title: Auth Service API
            description: |
                User registration, login, and JWT management.

                Use **POST /login** to obtain a token, then click **Authorize** and paste it.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
    areas:
        default:
            path_patterns:
                - ^/(?!api/doc)
